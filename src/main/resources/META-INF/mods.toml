side="BOTH"

[[dependencies."${mod_id}"]]
modId="refurbished_furniture"
mandatory=true
versionRange="[1.0.20,)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="framework"
mandatory=true
versionRange="[0.7.15,)"
ordering="NONE"
side="BOTH"